# Static security analysis. This package is an authorization server, so it is
# scanned on every push and pull request, not only on a schedule.

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended over the default: the default query pack does not
          # include every ReDoS query, and ReDoS is the reason this file exists.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
